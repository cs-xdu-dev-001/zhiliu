name: zhiliu

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/zhiliu.db
      INTEGRATION_SECRET_KEY: ${INTEGRATION_SECRET_KEY:-replace-with-at-least-32-random-characters}
      ZHILIU_MCP_TOKEN: ${ZHILIU_MCP_TOKEN:-replace-with-separate-32-character-random-token}
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://127.0.0.1:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS:-180}
      DEMO_MODE: ${DEMO_MODE:-false}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    volumes:
      - zhiliu-data:/data
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  zhiliu-data:
